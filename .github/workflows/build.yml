name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build release package
        shell: pwsh
        run: ./package.ps1 -Version 1.0.0

      - name: Show artifact
        shell: pwsh
        run: Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: CurskinInstaller-win64
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
